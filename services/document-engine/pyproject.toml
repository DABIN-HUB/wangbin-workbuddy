[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wangbin-document-cli"
version = "1.2.0"
description = "Local-only wangbin document processing CLI for WorkBuddy"
readme = "README.md"
requires-python = ">=3.12,<3.15"
authors = [{name = "wangbin"}]
license = "MIT"
dependencies = [
  "markitdown[pdf,docx,xlsx,pptx]==0.1.9",
  "openpyxl==3.1.5",
]

[project.scripts]
wangbin-document-cli = "wangbin_document_cli.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["wangbin_document_engine*", "wangbin_document_cli*"]
