name: Phase 3 cross-platform CLI acceptance

on:
  workflow_dispatch:
  push:
    paths:
      - 'services/document-engine/**'
      - 'packages/connectors/wangbin-document-cli/**'
      - 'packages/skills/wangbin-document-assistant-cli/**'
      - '.github/workflows/phase3-cross-platform.yml'

jobs:
  cli-runtime:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build wheel
        run: |
          python -m pip install --disable-pip-version-check build
          python -m build --wheel services/document-engine --outdir dist
      - name: Install isolated wheel
        shell: bash
        run: |
          python -m venv .phase3-ci-venv
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            source .phase3-ci-venv/Scripts/activate
          else
            source .phase3-ci-venv/bin/activate
          fi
          python -m pip install --no-input --disable-pip-version-check --only-binary=:all: dist/wangbin_document_cli-1.2.0-py3-none-any.whl
          python -m pip check
      - name: CLI smoke and real fixtures
        shell: bash
        env:
          PYTHONNOUSERSITE: '1'
          WANGBIN_ENGINE_SRC: ''
          PYTHONPATH: ''
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            source .phase3-ci-venv/Scripts/activate
          else
            source .phase3-ci-venv/bin/activate
          fi
          python -m wangbin_document_cli.main version
          python -m wangbin_document_cli.main doctor
          python -m wangbin_document_cli.main status
          mkdir -p "$RUNNER_TEMP/phase3-input" "$RUNNER_TEMP/phase3-output"
          for ext in pdf docx xlsx pptx html txt md; do
            cp "tests/fixtures/sample.$ext" "$RUNNER_TEMP/phase3-input/sample.$ext"
            python -m wangbin_document_cli.main parse --input "$RUNNER_TEMP/phase3-input/sample.$ext" --input-root "$RUNNER_TEMP/phase3-input" --output-root "$RUNNER_TEMP/phase3-output"
          done
          python -m wangbin_document_cli.main deduplicate --input "$RUNNER_TEMP/phase3-input/sample.xlsx" --input-root "$RUNNER_TEMP/phase3-input" --output-root "$RUNNER_TEMP/phase3-output" --format xlsx
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase3-${{ matrix.os }}
          path: |
            dist/*.whl
            ${{ runner.temp }}/phase3-output/**
