[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wangbin-workbuddy"
version = "1.0.0"
description = "wangbin WorkBuddy document assistant engineering toolkit"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "wangbin"}]
license = {text = "MIT"}
dependencies = [
  "markitdown[pdf,docx,xlsx,pptx]==0.1.9",
  "openpyxl==3.1.5",
  "PyYAML==6.0.3",
]

[project.optional-dependencies]
test = [
  "pytest==8.4.2",
  "python-docx==1.2.0",
]

[tool.setuptools.packages.find]
where = ["services/document-engine/src", "tooling"]
include = ["wangbin_document_engine*", "tooling*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "real_format: invokes real document parsers against generated files",
]
